name: Refresh catalog and deploy Firebase Hosting

on:
  push:
    branches: [main]
  schedule:
    - cron: '3-58/5 * * * *'
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graceful-gifts-firebase-live
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check whether the public Sheet changed
        id: source_check
        if: github.event_name == 'schedule' && github.event.schedule != '17 * * * *'
        run: node scripts/check-sheet-sync.mjs source
      - run: npm ci
        if: github.event_name != 'schedule' || steps.source_check.outputs.changed != 'false'
      - run: npm run build:firebase
        if: github.event_name != 'schedule' || steps.source_check.outputs.changed != 'false'
      - name: Check whether the built site changed
        id: artifact_check
        if: github.event_name != 'schedule' || steps.source_check.outputs.changed != 'false'
        run: node scripts/check-sheet-sync.mjs artifact
      - name: Set minimum Hosting retention
        id: retention
        if: steps.artifact_check.outputs.changed == 'true'
        run: node scripts/set-hosting-retention.mjs --apply
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRACEFUL_GIFTS_MANILA }}'
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.artifact_check.outputs.changed == 'true'
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRACEFUL_GIFTS_MANILA }}'
          projectId: graceful-gifts-manila
          channelId: live
      - name: Delete older Hosting versions
        if: steps.deploy.outcome == 'success'
        run: node scripts/cleanup-hosting-versions.mjs --apply
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRACEFUL_GIFTS_MANILA }}'
          PREVIOUS_VERSION: '${{ steps.retention.outputs.previous_version }}'
