name: Refresh catalog and deploy Firebase Hosting

on:
  push:
    branches: [main]
  schedule:
    - cron: '3-58/5 * * * *'
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graceful-gifts-firebase-live
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Firebase Hosting bandwidth status
        id: quota_check
        if: github.event_name == 'schedule'
        run: node scripts/check-sheet-sync.mjs availability
      - name: Check whether the public Sheet changed
        id: source_check
        if: github.event_name == 'schedule' && steps.quota_check.outputs.quota_blocked != 'true' && github.event.schedule != '17 * * * *'
        run: node scripts/check-sheet-sync.mjs source
      - run: npm ci
        if: github.event_name != 'schedule' || (steps.quota_check.outputs.quota_blocked != 'true' && steps.source_check.outputs.changed != 'false')
      - name: Install ImageMagick for verified image bounds
        if: github.event_name != 'schedule' || (steps.quota_check.outputs.quota_blocked != 'true' && steps.source_check.outputs.changed != 'false')
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick
          node scripts/verify-image-tools.mjs
      - run: npm run build:firebase
        if: github.event_name != 'schedule' || (steps.quota_check.outputs.quota_blocked != 'true' && steps.source_check.outputs.changed != 'false')
        env:
          GGM_FCM_VAPID_PUBLIC_KEY: '${{ secrets.GGM_FCM_VAPID_PUBLIC_KEY }}'
          GGM_CHAT_MEDIA_ENABLED: 'false'
      - name: Check whether the built site changed
        id: artifact_check
        if: github.event_name != 'schedule' || (steps.quota_check.outputs.quota_blocked != 'true' && steps.source_check.outputs.changed != 'false')
        run: node scripts/check-sheet-sync.mjs artifact
        env:
          ALLOW_QUOTA_DEPLOY: ${{ github.event_name != 'schedule' }}
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.artifact_check.outputs.changed == 'true'
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRACEFUL_GIFTS_MANILA }}'
          projectId: graceful-gifts-manila
          channelId: live
